# TownHall Columbus beverage vendors, order windows and channel rules.
#
# Source: PRD "Appendix: Vendor Order Windows", which is itself transcribed from
# TH_ORDER_GUIDE.docx. This file is seed data and is meant to be edited without
# a code change.
#
# Weekdays are names (monday..sunday). Times are 24-hour local.
# order_weekday/order_time  = the cutoff the manager must beat.
# delivery_weekday/time     = when that order lands.
# optional: true            = a secondary window the manager may skip.

vendors:
  - key: superior
    name: Superior Beverage
    channel: phone
    contact: {name: Shane, phone: "(614) 306-4582"}
    rules:
      keg_return_required: true
      notes:
        - "Two windows. The engine compares a 7-day cover against a 4-day cover and
           recommends the Wednesday window only when it meaningfully reduces the order."
    windows:
      - key: superior_sunday
        order_weekday: sunday
        order_time: "19:00"
        delivery_weekday: tuesday
        delivery_time: "09:00"
      - key: superior_wednesday
        order_weekday: wednesday
        order_time: "19:00"
        delivery_weekday: friday
        delivery_time: "09:00"
        note: "Second window, moved from Thursday 5pm to Wednesday 7pm (confirmed
               2026-09-21). Using it turns a 7-day cover into 4 days Mon->Fri."

  - key: columbus_distributing
    name: The Columbus Distributing Co.
    channel: phone
    contact: {name: Conner, phone: "(937) 581-1234"}
    rules:
      keg_return_required: true
    windows:
      - key: columbus_sunday
        order_weekday: sunday
        order_time: "19:00"
        delivery_weekday: tuesday
        delivery_time: "09:00"

  - key: arena
    name: Arena Liquor
    channel: email
    contact: {email: arenaliquor@gmail.com, label: "Orders (email only)"}
    rules:
      email_only: true
      order_email: arenaliquor@gmail.com
      emergency_contact: {name: Gursev, label: "Emergency only - do not use for routine orders"}
      notes:
        - "Email only. The engine will not produce a phone or text script for Arena."
        - "Order days (Sunday and Wednesday) confirmed by the operator 2026-09-28.
           DELIVERY IS THURSDAY, established on a full quarter (45 invoices,
           2026-06-24..09-25) rather than the one-month sample used earlier.
           Weighting by money is what settles it: Thursday is 11 invoices but
           $54,488 - 60% of all Arena spend, averaging $4,953 a drop. Saturday is
           the most FREQUENT day (13 invoices) at only 5.7% of spend, because
           those are counter pickups, not deliveries. Sunday: never."
        - "SUPERSEDES an earlier note here that read 'never once on Monday'. That
           held for 2026-08-28..09-28 but not for the quarter: 2 of 45 invoices
           landed Monday (7/20 and 7/27). The one-month window was too small to
           read a weekday pattern from."
        - "TWO CHANNELS, and they are indistinguishable until sorted by value.
           Wholesale invoices are prefixed OH00028...: 29 invoices, $86,838 (96%
           of spend), avg $2,994 across 12.5 lines, carrying the account number.
           Counter/will-call invoices are 6 digits: 16 invoices, $3,497 (4%), avg
           $219 across 1.7 lines, usually with NO account number, mostly Saturday
           - about 1.2 emergency runs a week. Only the wholesale channel is a
           delivery schedule; do not let the counter invoices train a forecast."
        - "$90,334.97 over the quarter, reconciling exactly: $87,951.60 line items
           + $2,027.75 otherCharges + $140.00 delivery + $215.62 tax."
        - "ONE PRODUCT, TWO BOTTLE SIZES, ONE MARGINEDGE PRODUCT ID. Arena item
           codes end in L (1 litre) or B (750ml) and MarginEdge maps both onto a
           single product, so product-level quantity adds sizes together: Tito's
           reads 597 units but is 444 x 1L + 153 x 750ml. This affects 35% of
           Arena spend (Tito's, Absolut, Casamigos Reposado, Grey Goose, Espolon
           Blanco). DEPLETION MUST BE COMPUTED PER VENDOR ITEM CODE, never per
           product name - at this size the error is ~25% on the largest line in
           the building."
        - "FOUR PRODUCTS CARRY DUPLICATE CODES - same product, same size, same
           price, so a per-item baseline reads low on both: Casamigos Reposado 1L
           (1809L_1L + 1809L, $2,199.60), Espolon Blanco 1L (2937L +
           2937L_Silver, $960.68), Don Julio 1942 (2720B + '2720B_ 750ML' - the
           code contains a space, $507.60), Tanqueray 1L (0326L + 0326L_1L,
           $253.80)."
        - "CONFIRMED DOUBLE BILL, $5,781.06 - RECOVERABLE. Operator confirmed
           2026-09-29 that Arena billed one delivery twice: OH0002811019
           (2026-07-22, 30 lines, acct 727546) and OH0002821151 (2026-07-30,
           29 lines, acct 0727546). All 29 lines match on item code, quantity
           and price; the $20 difference is a 'Liquor' line on one booked as
           delivery on the other, so both totals land identical. That is 6.4% of
           the quarter's Arena spend. The account number is written two ways
           across the pair, which is plausibly how the re-key got through."
        - "INGEST REQUIREMENT that follows from it: nothing in MarginEdge flagged
           this. It only surfaced by comparing line-item signatures across all 45
           invoices. Any invoice sharing a (code, quantity, price) signature with
           another from the same vendor must block approval rather than warn -
           a warning on a $5.8K double bill is not enough."
        - "$2,878.93 (3.2% of spend) has no product attached: 'Misc Liquor Item'
           (0002) and 'Liquor' (1) total $851.18, plus $2,027.75 of invoice-level
           charges. The largest single item is $1,482.38 on 2026-08-20
           (OH0002847733) described only as 'Adjustment to match total.' - 39% of
           that invoice. Unattributable spend inflates pour cost on everything
           else, so it cannot simply be spread."
        - "NAME QUALITY. Code 8523228242 is booked 'GIELARD PAMPLEMOUSE' - that is
           Giffard Pamplemousse, and a search for 'Giffard' misses it even though
           three other Giffard items are spelled right. Also 'Angustura Orange
           Bitters' beside 'Angostura Bitters', and 'Oyo Honey Vailla'. The
           wholesale account appears as 727546, 0727546 and TOWNHALL."
        - "Arena is 98.8% liquor by money but not exclusively: $1,098.38 across 14
           items is beer ($491.73), wine ($336.81), mixers and bitters ($197.87)
           and Giffard Orgeat syrup ($71.97). If the bar needs olive brine or
           orgeat, Arena carries it."
        - "A second Arena record exists, vendor 147343 'Arena Wine & Spirits',
           with NO orders in the quarter. Legacy; everything runs through 325343."
    windows:
      - key: arena_sunday
        order_weekday: sunday
        order_time: "17:00"
        delivery_weekday: thursday
        delivery_time: "09:00"
      - key: arena_wednesday
        order_weekday: wednesday
        order_time: "21:00"
        delivery_weekday: thursday
        delivery_time: "17:00"
        optional: true

  - key: southern_glazers
    name: Southern Glazer's of Ohio
    channel: phone
    contact: {name: Bethany, phone: "(740) 507-1973"}
    rules:
      # PRD: "a Southern Glazer's Tuesday drop has to cover eight days if the
      # Wednesday follow-up isn't placed". Tuesday to Tuesday is arithmetically
      # seven days, so the eighth is carried here as an explicit buffer rather
      # than buried in the cover math. Set to 0 to use the strict gap.
      cover_buffer_days: 1
      notes:
        - "THE FRIDAY WINDOW IS REAL, NOT HYPOTHETICAL. Of 20 invoices over
           2026-06-30..09-22, 12 landed Tuesday from the Monday cutoff and 6
           landed FRIDAY. The Wednesday follow-up is a second ordering slot the
           bar already uses most weeks, not a favour. requires_confirmation stays
           true because the window is still at Bethany's discretion, but the
           cover math should not assume it will be skipped."
        - "TWO UNFLAGGED PRICE INCREASES THIS QUARTER. Red Bull, both regular
           (201010) and sugar-free (0409127), went from $42.00 to $46.00 a case,
           +9.5%. Aperol 1L (557367) went from $142.00 to $156.95, +10.5%. Red
           Bull is a weekly line, so that is a standing cost increase."
        - "BITTERS PACK SIZE UNCONFIRMED. The 2026-08-14 invoice carries 334995
           Angostura Bitters and 976180 Angostura Orange, each at quantity 1 for
           $182.30. At that price a 'unit' is a case, not a bottle. Once-a-quarter
           buy, so the wrong unit sits in inventory unnoticed."
    windows:
      - key: sgws_monday
        order_weekday: monday
        order_time: "16:00"
        delivery_weekday: tuesday
        delivery_time: "09:00"
      - key: sgws_wednesday_followup
        order_weekday: wednesday
        order_time: "16:00"
        delivery_weekday: friday
        delivery_time: "09:00"
        optional: true
        requires_confirmation: true
        confirm_with: Bethany
        note: "Follow-up is not guaranteed - confirm with Bethany first."

  - key: sixth_city
    name: Sixth City Distributors
    channel: phone
    contact: {name: Jenna Carelly, phone: "(614) 301-4877"}
    rules:
      style_only: true
      style_unit: "1/6 bbl"
      keg_return_required: true
      notes:
        - "Rotating line. Output is a style-and-count recommendation, never a SKU."
    windows:
      - key: sixth_city_monday
        order_weekday: monday
        order_time: "17:00"
        delivery_weekday: tuesday
        delivery_time: "09:00"

  - key: cavalier
    name: Cavalier Distributing
    channel: phone
    contact: {name: Dan, phone: "(614) 582-0014"}
    rules:
      style_only: true
      style_unit: "1/6 bbl"
      keg_return_required: true
      notes:
        - "Rotating line. Output is a style-and-count recommendation, never a SKU."
    windows:
      - key: cavalier_monday
        order_weekday: monday
        order_time: "17:00"
        delivery_weekday: tuesday
