  - key: hillcrest
    name: Hillcrest Foodservice
    channel: phone
    rules:
      notes:
        - "Largest supplier in the building: $159,381 across 61 orders over
           2026-06-29..09-28, about $53K/month. Broadline food purveyor that also
           carries several bar prep goods and the bar's consumables."
        - "TWO ACCOUNTS, TWO SCHEDULES. 71357 is food and broadline (35 orders,
           $132,436) and lands MONDAY and FRIDAY. 71361 is paper, disposables and
           chemicals (26 orders, $26,945) and lands TUESDAY and FRIDAY. A third
           account, 55935, exists on the vendor record but placed no orders in
           the sampled quarter."
        - "Friday carries $82K of the $159K - over half the quarter's spend on one
           weekday, shared by both accounts. Nothing has ever landed on a Sunday
           and only one invoice in three months fell on a Thursday."
        - "The bar touches BOTH accounts. Prep pantry (allulose 38006, dark brown
           sugar 38029, drinking cider 4032, granulated sugar, pineapple juice)
           is on 71357. Bar consumables (black bevnaps 76379, sipper stirrers
           63256, smoothie straws 363360, 2oz souffle lids 60788, Beer Clean
           glass wash 70308) are on 71361."
        - "DUPLICATE ORDERING RISK: allulose 38006 ($214.08) and frozen
           strawberries 115005 are each ordered on BOTH accounts, which means the
           same item arriving on two different days. Assign each to one account."
        - "CARE WITH APPLE CIDER CODES. 4032 'Cider Apple' is the drinking cider.
           40118 and 40118S are apple cider VINEGAR. 4033 is labelled 'Apple Cider
           Fresh' but MarginEdge maps it to the vinegar product - a mapping error
           in their data, not ours."
    # Delivery weekdays are established from 61 invoices over 2026-06-29..09-28
    # and are the firm half of this schedule. The order TIMES are placeholders:
    # MarginEdge records only the invoice, and its createdDate is always exactly
    # one day AFTER the invoice date (61 of 61), so the data cannot reveal a
    # cutoff. Broadline houses run day-before ordering, which is the assumption
    # encoded here. Confirm the hour with the rep before the engine promises a
    # cover date off it.
    windows:
      - key: hillcrest_food_sunday
        order_weekday: sunday
        order_time: "17:00"
        delivery_weekday: monday
        delivery_time: "09:00"
        requires_confirmation: true
        note: "Account 71357 (food). Delivery day confirmed by 13 of 61 invoices;
               the 17:00 cutoff is an unconfirmed placeholder."
      - key: hillcrest_paper_monday
        order_weekday: monday
        order_time: "17:00"
        delivery_weekday: tuesday
        delivery_time: "09:00"
        requires_confirmation: true
        note: "Account 71361 (paper/disposables). Delivery day confirmed by 11 of
               61 invoices; the 17:00 cutoff is an unconfirmed placeholder."
      - key: hillcrest_both_thursday
        order_weekday: thursday
        order_time: "17:00"
        delivery_weekday: friday
        delivery_time: "09:00"
        requires_confirmation: true
        note: "BOTH accounts. This is the single most important Hillcrest cutoff:
               it carries the Friday delivery, which is over half the quarter's
               spend. Delivery day confirmed by 25 of 61 invoices."

  - key: amazon
    name: Amazon
    channel: online
    rules:
      notes:
        - "Long-tail supplier: 52 orders and roughly $11.4K in the month to
           2026-09-28 - more orders than any distributor. Sources prep goods,
           teas and one-off items the distributors do not carry."
        - "540 vendor items and NOT ONE carries a vendorItemCode. MarginEdge keys
           them by internal id only, so there is no SKU to quote on an order and
           the same product recurs under several near-identical listings."
        - "NO VENDOR CUTOFF EXISTS. Amazon is self-service with 1-2 day delivery,
           so unlike every other vendor here the window is a POLICY WE CHOOSE, not
           a deadline the vendor imposes. The windows below are that policy."
        - "The real problem measured over 2026-06-29..09-28 is not a missing
           cutoff, it is that nothing is batched: 195 orders landed on only 56
           separate days, so on an ordering day someone places 3.5 orders. Eight
           orders in one day happened four times, nine once. 60 of the 195 orders
           were under $50 - 31% of orders for $1,535, or 5.6% of spend."
        - "Monday (44 orders) and Thursday (38) are ALREADY the two heaviest days,
           so batching to them formalises existing behaviour rather than fighting
           it. Two orders a week instead of fifteen is about 85% fewer receiving
           events for the same product."
    # A policy window, not a vendor-imposed one - hence requires_confirmation is
    # false: there is no rep to confirm with. What needs agreeing is internal.
    windows:
      - key: amazon_monday_batch
        order_weekday: monday
        order_time: "17:00"
        delivery_weekday: wednesday
        delivery_time: "12:00"
        note: "Weekly batch, placed alongside the Monday bar cutoffs while the
               manager is already working last week's PMIX. Delivery is 1-2 days
               and not guaranteed to a weekday, so Wednesday is nominal."
      - key: amazon_thursday_batch
        order_weekday: thursday
        order_time: "17:00"
        delivery_weekday: saturday
        delivery_time: "12:00"
        optional: true
        note: "Second batch, catches anything needed for the weekend. Optional:
               skip it when the Monday order covered the week. A genuine 86 mid
               service is always allowed to bypass both windows."

  # --- Café program ------------------------------------------------------------
  # Separate from the bar: different windows, email-only, and longer leads.
  # Order days confirmed by the operator 2026-09-28. Delivery weekdays are the
  # days MarginEdge invoices actually landed over 2026-08-28..09-28, which is
  # observation rather than a vendor-stated schedule.

  - key: hartzler
    name: Hartzler Family Dairy
    channel: email
    contact:
      email: orders@hartzlerdairy.com
      phone: "(330) 345-8190"
      label: "Orders by email; phone is option #2"
    rules:
      email_only: true
      order_email: orders@hartzlerdairy.com
      notes:
        - "Email only. Their office is staffed Mon-Wed 8-12 and Fri 8-11, so the
           Thursday cutoff cannot be phoned in - questions must go before
           Wednesday noon."
        - "Ordered in CASES, not gallons."
        - "HARTZLER SUPPLIES EXACTLY TWO ITEMS: whole milk and half & half.
           Confirmed by the operator 2026-09-29. Heavy cream, butter, cream cheese
           and sour cream were previously attributed here off a MarginEdge purchase
           report that has NO VENDOR COLUMN - the consumption rates in that report
           were real but the vendor attribution was inferred, and it was wrong.
           Those items come from another supplier. Do not re-add them without an
           invoice showing Hartzler as the vendor: a five-day lead means anything
           ordered here in error is not recoverable for a week."
    windows:
      - key: hartzler_thursday
        order_weekday: thursday
        order_time: "17:00"
        delivery_weekday: tuesday
        delivery_time: "09:00"
        note: "Five-day lead. Tue-to-Tue shelf cover means roughly twelve days
               forward from the Thursday cutoff - the longest lead of any vendor."

  - key: berardis
    name: Berardi's Coffee
    channel: email
    contact:
      email: orders@berardiscoffee.com
      label: "Orders by email"
    rules:
      email_only: true
      order_email: orders@berardiscoffee.com
      notes:
        - "Email only."
        - "Sunday 17:00 is the same cutoff as Arena, two hours ahead of Superior
           and Columbus Dist. at 19:00. The only cafe item on the busiest ordering
           night, so the easiest to forget."
    windows:
      - key: berardis_sunday
        order_weekday: sunday
        order_time: "17:00"
        delivery_weekday: tuesday
        delivery_time: "09:00"
        note: "Order day and cutoff both confirmed by the operator: Sunday by
               17:00 (2026-09-29). Invoices landed Tue x3 and Wed x1 over the
               sampled month, so Tuesday is the modal delivery, not guaranteed."

  - key: oyo
    name: OYO Vodka
    channel: phone
    contact: {name: Zack, phone: "(614) 981-9341"}
    rules:
      route_through: arena
      routed_contact_hidden_unless: arena_out_of_stock
      notes:
        - "Order through Arena first. Zack's number is surfaced only when the
           manager marks Arena out of stock."
    # No fixed window: the guide records OYO as ordered as needed. Cover is
    # inherited from Arena while routing through Arena.
    windows: []
