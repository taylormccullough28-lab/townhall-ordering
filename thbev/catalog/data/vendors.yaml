  - key: heidelberg
    name: Heidelberg / Wine Trends
    channel: phone
    contact: {name: Tess Canby, phone: "(740) 583-4555"}
    rules:
      delivery_note: "Deliver after 9am, hallway behind bar."
    windows:
      - key: heidelberg_wednesday
