# Product catalog seed.
#
# HONESTY NOTE ON VENDOR ASSIGNMENT
# ---------------------------------
# The PRD names specific products (pack sizes in "The Math", prep ingredients,
# bottle-service exposure) but the product-to-distributor mapping lives in
# TH_ORDER_GUIDE.docx, which is not in this repo. Every product below therefore
# carries `vendor_confidence`:
#
#   confirmed   - the PRD states the vendor outright (OYO routes through Arena;
#                 Sixth City and Cavalier own the rotating 1/6 bbl lines).
#   unconfirmed - vendor is null. The order engine groups these under an
#                 "unassigned" bucket and refuses to pretend it knows who to
#                 call. Fill these in from the order guide.
#
# Nothing here is invented from nothing: every product name, pack size and
# conversion type traces to a line in the PRD.
#
# category drives the event/weather multipliers in config.yaml.
# conversion drives the depletion math.
# pack_size is what order quantities round UP to.

products:
  # --- Packaged beer / RTD (pack sizes stated verbatim in the PRD) -----------
  - key: bud_light
    name: Bud Light
    category: light_beer
    conversion: packaged
    pack_size: 24
    unit_label: bottle
    pack_label: case
    order_critical: true
    vendor: null
    vendor_confidence: unconfirmed

  - key: mich_ultra_gold
    name: Michelob Ultra Gold
