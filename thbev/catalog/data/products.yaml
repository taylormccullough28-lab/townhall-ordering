# entries below exist to exercise the recipe machinery end to end and are
# labelled unverified. Do not treat these amounts as house specs - PRD open
# question 6 ("do cocktail recipes exist in writing?") is still open, and
# spirit and prep forecasting is only as good as the answer.
recipes:
